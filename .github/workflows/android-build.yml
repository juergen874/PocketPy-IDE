name: Build & Release (Android & Windows)

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate Fallback Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Optimized Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          find app/build/outputs/apk/release/ -name "*.apk" -exec mv {} app/build/outputs/apk/release/PocketPy-IDE-2.0.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketPy-IDE-2.0-apk
          path: app/build/outputs/apk/release/PocketPy-IDE-2.0.apk
          if-no-files-found: warn

      - name: Release APK Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows x64 Binary
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build PocketPy Executable
        run: cmake --build build --config Release

      - name: Run Test Suite on Windows
        run: .\build\Release\pocketpy.exe tests\test_full_suite.py

      - name: Package Windows Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\Release\pocketpy.exe -Destination dist\
          Copy-Item README.md -Destination dist\
          Compress-Archive -Path dist\* -DestinationPath pocketpy-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketpy-windows-x64
          path: pocketpy-windows-x64.zip
          if-no-files-found: warn

      - name: Release Windows Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pocketpy-windows-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

